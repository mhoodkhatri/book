<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="isaac-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#76b900"/>
    </linearGradient>
    <linearGradient id="isaac-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4d7c0f"/>
      <stop offset="100%" stop-color="#365314"/>
    </linearGradient>
    <linearGradient id="isaac-chip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2e05"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <filter id="isaac-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- GPU chip body -->
  <rect x="10" y="12" width="28" height="24" rx="3" fill="url(#isaac-dark)"/>
  <rect x="12" y="14" width="24" height="20" rx="2" fill="url(#isaac-chip)"/>

  <!-- Processing cores grid -->
  <g filter="url(#isaac-glow)">
    <rect x="15" y="17" width="5" height="5" rx="1" fill="url(#isaac-grad)"/>
    <rect x="22" y="17" width="5" height="5" rx="1" fill="url(#isaac-grad)"/>
    <rect x="29" y="17" width="5" height="5" rx="1" fill="url(#isaac-grad)"/>
    <rect x="15" y="25" width="5" height="5" rx="1" fill="url(#isaac-grad)"/>
    <rect x="22" y="25" width="5" height="5" rx="1" fill="url(#isaac-grad)"/>
    <rect x="29" y="25" width="5" height="5" rx="1" fill="url(#isaac-grad)"/>
  </g>

  <!-- Core highlights -->
  <rect x="16" y="18" width="2" height="2" rx="0.5" fill="#ecfccb" opacity="0.8"/>
  <rect x="23" y="18" width="2" height="2" rx="0.5" fill="#ecfccb" opacity="0.8"/>
  <rect x="30" y="18" width="2" height="2" rx="0.5" fill="#ecfccb" opacity="0.8"/>
  <rect x="16" y="26" width="2" height="2" rx="0.5" fill="#ecfccb" opacity="0.8"/>
  <rect x="23" y="26" width="2" height="2" rx="0.5" fill="#ecfccb" opacity="0.8"/>
  <rect x="30" y="26" width="2" height="2" rx="0.5" fill="#ecfccb" opacity="0.8"/>

  <!-- Pin connections - top -->
  <rect x="15" y="8" width="2" height="4" rx="0.5" fill="url(#isaac-grad)"/>
  <rect x="20" y="8" width="2" height="4" rx="0.5" fill="url(#isaac-grad)"/>
  <rect x="25" y="8" width="2" height="4" rx="0.5" fill="url(#isaac-grad)"/>
  <rect x="30" y="8" width="2" height="4" rx="0.5" fill="url(#isaac-grad)"/>

  <!-- Pin connections - bottom -->
  <rect x="15" y="36" width="2" height="4" rx="0.5" fill="url(#isaac-grad)"/>
  <rect x="20" y="36" width="2" height="4" rx="0.5" fill="url(#isaac-grad)"/>
  <rect x="25" y="36" width="2" height="4" rx="0.5" fill="url(#isaac-grad)"/>
  <rect x="30" y="36" width="2" height="4" rx="0.5" fill="url(#isaac-grad)"/>

  <!-- Pin connections - left -->
  <rect x="6" y="17" width="4" height="2" rx="0.5" fill="url(#isaac-grad)"/>
  <rect x="6" y="22" width="4" height="2" rx="0.5" fill="url(#isaac-grad)"/>
  <rect x="6" y="27" width="4" height="2" rx="0.5" fill="url(#isaac-grad)"/>

  <!-- Pin connections - right -->
  <rect x="38" y="17" width="4" height="2" rx="0.5" fill="url(#isaac-grad)"/>
  <rect x="38" y="22" width="4" height="2" rx="0.5" fill="url(#isaac-grad)"/>
  <rect x="38" y="27" width="4" height="2" rx="0.5" fill="url(#isaac-grad)"/>

  <!-- AI brain symbol in center -->
  <circle cx="24" cy="24" r="4" fill="none" stroke="#a3e635" stroke-width="1" opacity="0.6"/>
  <circle cx="24" cy="24" r="2" fill="#a3e635" opacity="0.4"/>
</svg>
