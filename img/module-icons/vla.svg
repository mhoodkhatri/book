<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="vla-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="vla-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="vla-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <filter id="vla-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Vision: Eye -->
  <g filter="url(#vla-glow)">
    <ellipse cx="14" cy="12" rx="9" ry="6" fill="url(#vla-dark)"/>
    <ellipse cx="14" cy="12" rx="7" ry="4.5" fill="url(#vla-grad)"/>
    <circle cx="14" cy="12" r="3" fill="#1e1b4b"/>
    <circle cx="14" cy="12" r="1.5" fill="#ede9fe"/>
    <ellipse cx="15.5" cy="10.5" rx="1" ry="0.6" fill="white" opacity="0.8"/>
  </g>

  <!-- Language: Speech/text waves -->
  <g filter="url(#vla-glow)">
    <rect x="28" y="8" width="14" height="3" rx="1.5" fill="url(#vla-grad)"/>
    <rect x="30" y="13" width="10" height="2.5" rx="1.25" fill="url(#vla-light)" opacity="0.8"/>
    <rect x="32" y="17" width="6" height="2" rx="1" fill="url(#vla-light)" opacity="0.6"/>
  </g>

  <!-- Connecting neural pathway -->
  <path d="M20 16 Q24 20 24 24 Q24 28 20 32"
        stroke="url(#vla-light)" stroke-width="2" fill="none"
        stroke-linecap="round" opacity="0.6"/>
  <path d="M28 16 Q24 20 24 24 Q24 28 28 32"
        stroke="url(#vla-light)" stroke-width="2" fill="none"
        stroke-linecap="round" opacity="0.6"/>

  <!-- Central processing node -->
  <circle cx="24" cy="24" r="4" fill="url(#vla-grad)" filter="url(#vla-glow)"/>
  <circle cx="24" cy="24" r="2" fill="#ede9fe"/>

  <!-- Action: Robotic hand/gripper -->
  <g filter="url(#vla-glow)">
    <!-- Palm -->
    <rect x="18" y="34" width="12" height="6" rx="2" fill="url(#vla-grad)"/>

    <!-- Fingers -->
    <rect x="19" y="40" width="3" height="5" rx="1" fill="url(#vla-light)"/>
    <rect x="23" y="40" width="3" height="6" rx="1" fill="url(#vla-grad)"/>
    <rect x="27" y="40" width="3" height="5" rx="1" fill="url(#vla-light)"/>

    <!-- Finger joints -->
    <rect x="19.5" y="42" width="2" height="1" rx="0.5" fill="#4c1d95" opacity="0.5"/>
    <rect x="23.5" y="43" width="2" height="1" rx="0.5" fill="#4c1d95" opacity="0.5"/>
    <rect x="27.5" y="42" width="2" height="1" rx="0.5" fill="#4c1d95" opacity="0.5"/>

    <!-- Wrist connector -->
    <rect x="21" y="32" width="6" height="2" rx="1" fill="url(#vla-dark)"/>
  </g>

  <!-- Data flow particles -->
  <circle cx="22" cy="20" r="1" fill="#c4b5fd" opacity="0.9"/>
  <circle cx="26" cy="28" r="1" fill="#c4b5fd" opacity="0.9"/>
  <circle cx="18" cy="24" r="0.8" fill="#a78bfa" opacity="0.7"/>
  <circle cx="30" cy="24" r="0.8" fill="#a78bfa" opacity="0.7"/>
</svg>
