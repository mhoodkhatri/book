  <!-- Diagonal connectors - top-right -->
  <path d="M65 18 Q78 22 82 35" stroke="url(#g3)" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Diagonal connectors - bottom-right -->
  <path d="M82 65 Q78 78 65 82" stroke="url(#g3)" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Diagonal connectors - bottom-left -->
  <path d="M35 82 Q22 78 18 65" stroke="url(#g3)" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Diagonal connectors - top-left -->
